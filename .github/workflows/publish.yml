name: Publish to PyPI

# Publishes to PyPI when a GitHub Release is published, or manually from the
# Actions tab. Uses PyPI Trusted Publishing (OIDC) — no API token, no secrets.
# One-time setup on PyPI:
#   pypi.org → Your projects → pystates-CLI → Publishing
#     Owner:            Maksum867
#     Repository:       PyStates
#     Workflow name:    publish.yml
#     Environment:      pypi
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install -e ".[dev]"

      - name: Run the test suite before publishing
        run: python -m pytest -q

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Sanity-check the version matches the tag
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = re.search(r'__version__ = "([^"]+)"', pathlib.Path("pystates/__init__.py").read_text()).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != version:
              raise SystemExit(f"Tag {tag!r} does not match package version {version!r}")
          print(f"Version {version} matches tag")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pystates-CLI
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pystates-CLI
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A version may already exist if it was uploaded by hand; do not fail
          # the workflow over files PyPI already has.
          skip-existing: true
