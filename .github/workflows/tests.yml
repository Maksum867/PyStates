name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # macOS runners are the scarcest in GitHub's free pool: a macOS 3.9
          # job sat queued for 30 minutes and was auto-cancelled without ever
          # starting (no log blob at all). macOS keeps the two newest versions,
          # which is enough to prove the code is not platform-specific there.
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          # reportlab 5.x refuses to import on Python < 3.10 (it raises
          # ImportError from reportlab/__init__.py), so on 3.9 we stay on the
          # 4.x line, which supports 3.9 and has the same API we use.
          python -m pip install -e ".[dev]" "reportlab<5"

      - name: Check the installed reportlab version
        run: python -c "import reportlab, sys; print(sys.version.split()[0], '-> reportlab', reportlab.Version)"

      - name: Run test suite
        run: python -m pytest -q

  # ubuntu-latest currently resolves to Ubuntu 26.04, and actions/python-versions
  # has no 3.9 build for it ("The version '3.9' with architecture 'x64' was not
  # found for Ubuntu 26.04"). Python 3.9 is therefore covered on the two
  # platforms that still ship it: Windows and macOS.
  test-ubuntu:
    name: Python ${{ matrix.python-version }} on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .
      - run: ruff format --check .

  package:
    name: Build & validate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the built wheel and smoke-test the CLI
        run: |
          python -m pip install dist/*.whl
          pystates --version
          pystates --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
