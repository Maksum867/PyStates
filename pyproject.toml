[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pystates-CLI"
version = "0.1.0"
description = "CLI tool to download and save articles from various web resources into Markdown, Text, and other formats."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Maksym Khlystun" }
]
keywords = ["cli", "parser", "articles", "markdown", "scraper", "text-extractor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]


dependencies = [
    "requests>=2.31.0",
    "trafilatura>=1.6.0",
    "rich>=13.0.0",
]


[project.optional-dependencies]
pdf = [
    "reportlab>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/pystates"
Repository = "https://github.com/yourusername/pystates"
Issues = "https://github.com/yourusername/pystates/issues"


[project.scripts]
pystates = "pystates.cli:main"

[tool.setuptools.packages.find]
where = ["."]