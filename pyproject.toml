[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pystates-CLI"
version = "0.2.0"
description = "CLI tool to download and save articles from various web resources into Markdown, Text, and other formats."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Maksym Khlystun" }
]
keywords = ["cli", "parser", "articles", "markdown", "scraper", "text-extractor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]

dependencies = [
    "requests>=2.31.0",
    "trafilatura>=1.6.0",
]

[project.optional-dependencies]
word = [
    "python-docx>=1.1.0",
]
pdf = [
    "reportlab>=4.0.0",
]
# Everything, for local development and CI.
dev = [
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
    "pytest>=8.0",
    "ruff>=0.5",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/Maksum867/PyStates"
Repository = "https://github.com/Maksum867/PyStates"
Issues = "https://github.com/Maksum867/PyStates/issues"
Changelog = "https://github.com/Maksum867/PyStates/blob/main/CHANGELOG.md"

[project.scripts]
pystates = "pystates.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pystates*"]

[tool.pytest.ini_options]
testpaths = ["pystates/tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:pystates.*",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    # Keep the config minimal; add rules here only when a false positive appears.
]
